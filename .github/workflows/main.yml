name: Deploy to Website Astro React ver.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-flugel-astro-react
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Node.jsをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26' # プロジェクトに合わせて変更可（LTS版など）
          cache: 'npm'

      # 2. パッケージのインストールとビルド実行（ここで dist/ が作られる）
      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Install
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test
        run: npx playwright test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # 3. SSH鍵の準備
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/sakura_deploy_key
          chmod 600 ~/.ssh/sakura_deploy_key

      # 4. 生成された dist/ をさくらサーバーへ転送
      - name: Sync files
        run: |
          rsync -avz --delete \
          -e "ssh -i ~/.ssh/sakura_deploy_key -o StrictHostKeyChecking=no" \
          ./dist/ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USERNAME }}/www/pre-flight/
